name: book_lec_app
description: "A new Flutter project for Smart Lecture Management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Formatting ---
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  
  # --- Logic & State ---
  async: ^2.13.1
  rxdart: ^0.28.0
  provider: ^6.1.2

  # --- Firebase Core Services ---
  firebase_core: ^3.11.0
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.5.0
  firebase_messaging: ^15.2.10
  
  # --- API Handshake & Network ---
  # googleapis_auth is used to get the OAuth2 token for FCM v1
  googleapis_auth: ^1.6.0 
  # http is required by googleapis_auth to perform the handshake
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true