name: book_lec_app
description: "A new Flutter project for Smart Lecture Management."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  async: ^2.13.1
  rxdart: ^0.28.0
  provider: ^6.1.2

  firebase_core: ^3.11.0
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.5.0
  firebase_messaging: ^15.2.10

  googleapis_auth: ^1.6.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#FFFFFF"